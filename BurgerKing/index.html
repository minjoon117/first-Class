<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/default.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        @font-face {
            font-family: "Pretendard Variable";
            src: url("../font/PretendardVariable.woff2") format("woff2");
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "BKR";
            src: url("../font/BKBulMatPro-Bold.woff") format("woff");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "Sandoll GothicNeoRound";
            src: url("../font/SDGothicNeoRound-eMd.woff") format("woff");
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }
    </style>
    <title>버거킹 로그인 화면</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="theme-styles.css">
</head>
<body>
    <div id="style-theme-control">
        <label for="design-theme">디자인 테마</label>
        <select id="design-theme" aria-label="디자인 스타일 선택">
            <option value="art-deco" selected>18 Art Deco</option>
            <option value="minimalism">01 Minimalism</option>
            <option value="editorial">02 Editorial</option>
            <option value="swiss">03 Swiss Style</option>
            <option value="bento">04 Bento Grid</option>
            <option value="glassmorphism">05 Glassmorphism</option>
            <option value="claymorphism">06 Claymorphism</option>
            <option value="neo-brutalism">07 Neo Brutalism</option>
            <option value="maximalism">08 Maximalism</option>
            <option value="kinetic">09 Kinetic Typography</option>
            <option value="grainy-gradient">10 Grainy Gradient</option>
            <option value="y2k-chrome">11 Y2K Chrome</option>
            <option value="pixel-art">12 Pixel Art</option>
            <option value="memphis">13 Memphis</option>
            <option value="bauhaus">14 Bauhaus</option>
            <option value="pop-art">15 Pop Art</option>
            <option value="collage">16 Collage</option>
            <option value="risograph">17 Risograph</option>
            <option value="cyberpunk">19 Cyberpunk</option>
            <option value="isometric">20 Isometric</option>
        </select>
    </div>
    <div id="wrap" data-theme="art-deco">
        <header>
            <h1>로그인</h1>
            <button class="prev_btn"><span class="sr-only">이전버튼</span></button> 
        </header>
        <main>
            <h2 class="title">
                <span>안녕하세요:)</span>
                <span>버거킹입니다.</span>
            </h2>
            <form action="">
                <!-- 이메일 로그인 -->
                <fieldset>
                    <legend class="sr-only">로그인화면</legend>
                    <!-- 아이디 -->
                    <label for="email" class="email">이메일 로그인</label>
                    <div class="input_box">
                        <input type="email" id="email" name="email" placeholder="아이디(이메일)을 입력해 주세요">
                    </div>
                    <!-- 비밀번호 -->
                    <div class="input_box rela">
                        <input type="password" name="password" placeholder="비밀번호를 입력해 주세요">
                        <button type="button" class="pw_btn"><span class="sr-only">비밀번호 보기</span></button>
                    </div>
                    <div class="login_option">
                        <label>
                            <input type="checkbox" class="check sr-only" checked>
                            <span>자동 로그인</span>
                        </label>
                        <label>
                            <input type="checkbox" class="check sr-only">
                            <span>아이디 저장</span>
                        </label>
                    </div>
                    <button type="submit" class="login_btn">로그인</button>
                </fieldset>
            </form>        
            <div class="login_link">
                <a href="#">아이디 찾기</a>
                <a href="#">비밀번호 재설정</a>
                <a href="#">회원가입</a>
            </div>  
            <div class="sns_login">
                <p>SNS으로 간편하게 로그인</p>
                <div class="sns_list">
                    <a href="#"><span class="sr-only">카카오로그인</span></a>
                    <a href="#"><span class="sr-only">네이버로그인</span></a>
                    <a href="#"><span class="sr-only">애플로그인</span></a>
                    <a href="#"><span class="sr-only">삼성카드로그인</span></a>
                </div>
            </div>   
        </main>
    </div> 
<script>
    // 선택한 디자인 스타일을 로그인 화면에 적용합니다.
    const themeSelect = document.getElementById("design-theme");
    const themeWrap = document.getElementById("wrap");
    themeSelect.addEventListener("change", function () {
        themeWrap.dataset.theme = this.value;
    });
</script>
</body>
</html>
