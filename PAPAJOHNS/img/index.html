<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파파존스 리뉴얼 포트폴리오</title>

    <link rel="stylesheet" href="../../font/css/default.css">
    <link rel="stylesheet" href="../../npm/Swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="CSS/main.css">
    <script src="../../npm/Swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>
        <main>
            <div class="hero-sec">
                <div class="visual swiper">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="260922_americancombo_main.jpg" alt="아메리칸 콤보 프로모션" class="pc">
                            <img src="m.img-01.jpg" alt="모바일 브라우니 프로모션" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="261002_buldak_telecom_main.jpg" alt="불닭 프로모션" class="pc">
                            <img src="m.img-02.jpg" alt="모바일 불닭 프로모션" class="mo">
                        </div>
                    </div>

                    <div class="swiper-pagination"></div>
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                    <div class="swiper-scrollbar"></div>
                </div>
            </div>
        </main>
        <footer>&copy;</footer>
    </div>

    <script>
        const swiper = new Swiper('.hero-sec .swiper', {
            direction: 'horizontal',
            loop: true,
            pagination: {
                el: '.visual .swiper-pagination',
                type: 'fraction',
            },
            navigation: {
                nextEl: '.visual .swiper-button-next',
                prevEl: '.visual .swiper-button-prev',
            },
            scrollbar: {
                el: '.visual .swiper-scrollbar',
                draggable: true,
            },
        });
    </script>
</body>
</html>
