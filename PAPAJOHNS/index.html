<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파파존스 리뉴얼</title>
    <link rel="stylesheet" href="./CSS/main.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0">
    <script src="./main.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="brand-logo" href="./index.html" aria-label="파파존스 홈">PAPA JOHNS</a>

        <nav class="main-nav" aria-label="주 메뉴">
            <a href="#menu">메뉴</a>
            <a href="#events">이벤트·할인</a>
            <a href="#coupon">E-쿠폰주문</a>
            <a href="#store">매장찾기</a>
            <a href="#customer">고객센터</a>
            <a href="#company">회사소개</a>
        </nav>

        <div class="header-tools" aria-label="바로가기">
            <a href="#mypage" aria-label="마이페이지" title="마이페이지">
                <span class="material-symbols-outlined" aria-hidden="true">person</span>
            </a>
            <a href="#language" aria-label="언어 선택" title="언어 선택">
                <span class="material-symbols-outlined" aria-hidden="true">language</span>
            </a>
            <a href="#cart" aria-label="장바구니" title="장바구니">
                <span class="material-symbols-outlined" aria-hidden="true">shopping_cart</span>
            </a>
        </div>

        <button class="mobile-menu" type="button" aria-label="메뉴 열기">
            <span></span><span></span><span></span>
        </button>
    </header>

    <main>
        <section class="hero" aria-label="파파존스 프로모션">
            <div class="hero-slider">
                <div class="hero-slides">
                    <div class="hero-slide is-active">
                        <img src="./img/260922_americancombo_main.jpg" alt="아메리칸 콤보 프로모션">
                    </div>
                    <div class="hero-slide">
                        <img src="./img/m.img-02.jpg" alt="불닭 까르보 치킨 통신사 할인 프로모션">
                    </div>
                    <div class="hero-slide">
                        <img src="./img/261001_hanapick_last10days_main.jpg" alt="하나카드 LAST 10 DAYS 할인 프로모션">
                    </div>
                    <div class="hero-slide">
                        <img src="./img/261016_twocities_main.jpg" alt="파파존스 문화 이벤트 프로모션">
                    </div>
                </div>

                <button class="hero-arrow hero-prev" type="button" aria-label="이전 배너">
                    <span aria-hidden="true">&#10094;</span>
                </button>
                <button class="hero-arrow hero-next" type="button" aria-label="다음 배너">
                    <span aria-hidden="true">&#10095;</span>
                </button>

                <div class="hero-controls" aria-label="배너 재생 설정">
                    <span class="hero-page" aria-live="polite">1 / 4</span>
                    <button class="hero-toggle" type="button" aria-label="자동 재생 일시정지">
                        <span aria-hidden="true">&#8545;</span>
                    </button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
