<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파파존스 리뉴얼</title>
    <link rel="stylesheet" href="./CSS/main.css">
    <script src="./main.js" defer></script>
</head>
<body>
    <main>
        <section class="hero" aria-label="파파존스 프로모션">
            <div class="hero-slider">
                <div class="hero-slides">
                    <div class="hero-slide is-active">
                        <img src="./img/260922_americancombo_main.jpg" alt="아메리칸 콤보 프로모션">
                    </div>
                    <div class="hero-slide">
                        <img src="./img/m.img-01.jpg" alt="파파존스 할인 프로모션">
                    </div>
                    <div class="hero-slide">
                        <img src="./img/261002_buldak_telecom_main.jpg" alt="불닭 까르보 치킨 프로모션">
                    </div>
                    <div class="hero-slide">
                        <img src="./img/m.img-02.jpg" alt="파파존스 이벤트 프로모션">
                    </div>
                </div>

                <button class="hero-arrow hero-prev" type="button" aria-label="이전 배너">
                    <span aria-hidden="true">&#10094;</span>
                </button>
                <button class="hero-arrow hero-next" type="button" aria-label="다음 배너">
                    <span aria-hidden="true">&#10095;</span>
                </button>

                <div class="hero-controls" aria-label="배너 재생 설정">
                    <span class="hero-page" aria-live="polite">1 / 4</span>
                    <button class="hero-toggle" type="button" aria-label="자동 재생 일시정지">
                        <span aria-hidden="true">&#8545;</span>
                    </button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
